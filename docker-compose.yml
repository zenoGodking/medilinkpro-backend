services:
  postgres:
    image: postgres:16-alpine
    container_name: medilinkpro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: medilinkpro
      POSTGRES_USER: medilinkpro_user
      POSTGRES_PASSWORD: medilinkpro_pass
    ports:
      - "5432:5432"
    volumes:
      - medilinkpro-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medilinkpro_user -d medilinkpro"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medilinkpro-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: medilinkpro
      DB_USERNAME: medilinkpro_user
      DB_PASSWORD: medilinkpro_pass
      # Secrets lus depuis le fichier .env (non versionne, voir .env.example)
      JWT_SECRET: ${JWT_SECRET:?Definissez JWT_SECRET dans .env}
      JWT_EXPIRATION_MS: 86400000
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:?Definissez SUPER_ADMIN_EMAIL dans .env}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:?Definissez SUPER_ADMIN_PASSWORD dans .env}
      CORS_ORIGINES: ${CORS_ORIGINES:?Definissez CORS_ORIGINES dans .env}
      UPLOAD_DIR: /app/uploads
      PRIVATE_UPLOAD_DIR: /app/private-uploads
    ports:
      - "8080:8080"
    volumes:
      - medilinkpro-uploads:/app/uploads
      - medilinkpro-private-uploads:/app/private-uploads

volumes:
  medilinkpro-pgdata:
  medilinkpro-uploads:
  medilinkpro-private-uploads:
