server:
  port: ${PORT:8080}
  # Reponses toujours declarees en UTF-8 (accents des messages), quel que soit le client.
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: medilinkpro-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:medilinkpro}
    username: ${DB_USERNAME:medilinkpro_user}
    password: ${DB_PASSWORD:medilinkpro_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    # Jamais de requetes SQL dans les journaux en production : elles contiennent des donnees de sante.
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 60MB

medilinkpro:
  # Super administrateur cree au premier demarrage s'il n'existe pas (voir AdminInitializer).
  # Aucune valeur par defaut : a fournir par variables d'environnement (le profil dev en fournit
  # pour le poste de developpement). Verifie au demarrage par VerificationConfigurationProduction.
  super-admin:
    nom: ${SUPER_ADMIN_NOM:admin}
    prenom: ${SUPER_ADMIN_PRENOM:Super}
    email: ${SUPER_ADMIN_EMAIL:}
    mot-de-passe: ${SUPER_ADMIN_PASSWORD:}
  # Cle AES-256 (32 octets en Base64) chiffrant les donnees de sante au repos (champs sensibles,
  # photos, documents). A SAUVEGARDER en lieu sur : sa perte rend ces donnees illisibles.
  # Generer : openssl rand -base64 32
  chiffrement:
    cle: ${CLE_CHIFFREMENT:}
  # Origines autorisees a appeler l'API et le WebSocket (URL du frontend), separees par des virgules.
  # Ex : CORS_ORIGINES=https://medilinkpro.vercel.app,https://app.medilinkpro.cm
  cors:
    origines: ${CORS_ORIGINES:}
  # Fuseau horaire des rappels de medicaments (heures saisies par les patients).
  fuseau-horaire: ${FUSEAU_HORAIRE:Africa/Douala}
  # Salle de teleconsultation : ouverte N minutes avant l'heure du rendez-vous, pendant duree-max-minutes apres.
  teleconsultation:
    ouverture-minutes-avant: ${TELECONSULTATION_OUVERTURE_MINUTES:15}
    duree-max-minutes: ${TELECONSULTATION_DUREE_MAX_MINUTES:120}
  # Notifications push : cles VAPID (generees et stockees en base si absentes) et contact de l'emetteur.
  push:
    vapid-public: ${VAPID_PUBLIC_KEY:}
    vapid-private: ${VAPID_PRIVATE_KEY:}
    sujet: ${VAPID_SUJET:mailto:contact@medilinkpro.cm}
  jwt:
    # Cle secrete encodee en Base64 (HS256, 256 bits minimum), fournie par variable d'environnement.
    # Generer : openssl rand -base64 48
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  upload:
    # Dossier disque de stockage des fichiers uploades (photos d'etablissements, etc.).
    # En Docker, ce chemin est monte sur un volume persistant (voir docker-compose.yml).
    dir: ${UPLOAD_DIR:uploads}
    url-prefix: /uploads
    # Photos faciales des patients : dossier NON expose publiquement (servi via endpoints authentifies).
    private-dir: ${PRIVATE_UPLOAD_DIR:private-uploads}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.medilinkpro.backend: INFO
    org.springframework.security: INFO
